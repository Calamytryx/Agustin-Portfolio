name: Refresh GitHub Projects

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh projects snapshot
        run: node scripts/update-projects.mjs
        env:
          GITHUB_USERNAME: Calamytryx
          GITHUB_PROJECTS_PER_PAGE: '12'
          GITHUB_PROJECTS_INCLUDE_FORKS: 'false'
          GITHUB_PROJECTS_INCLUDE_ARCHIVED: 'false'
          GITHUB_PROJECTS_OUTPUT: projects.json

      - name: Commit changes
        run: |
          if git diff --quiet -- projects.json; then
            echo "No project updates"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.json
          git commit -m "chore: refresh GitHub projects"
          git push
